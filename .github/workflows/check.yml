name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: |
            package-lock.json
            news/package-lock.json

      - name: Install dependencies
        run: npm ci && npm ci --prefix news

      # The lesson check renders every diagram with mermaid-cli.
      - name: Install mermaid-cli
        run: npm i -g @mermaid-js/mermaid-cli@11.6.0

      - name: Start Postgres, OpenFGA and MinIO
        run: ./.github/start-test-services.sh

      - name: Typecheck, tests and repo checks
        run: npm run check
